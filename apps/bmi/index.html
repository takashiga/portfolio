<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI・代謝チェッカー</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #20243a;
      --border: #2a2d3e;
      --accent: #0ea5e9;
      --text: #e2e4f0;
      --muted: #8b90a7;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      padding: 32px 16px;
    }
    .page {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h1 span { font-size: 1.8rem; }

    /* Form */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }
    .card h2 { font-size: 0.9rem; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; margin-bottom: 20px; }
    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 480px) { .fields { grid-template-columns: 1fr; } }
    .field label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .field input, .field select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }
    .field select option { background: var(--surface); }
    .gender-row { display: flex; gap: 8px; }
    .gender-btn {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .gender-btn.active { background: rgba(14,165,233,0.15); border-color: var(--accent); color: var(--accent); }
    .calc-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      padding: 13px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
      font-family: inherit;
    }
    .calc-btn:hover { opacity: 0.85; }

    /* Results */
    #results { display: none; flex-direction: column; gap: 16px; }
    #results.show { display: flex; }

    .bmi-hero {
      text-align: center;
      padding: 28px 24px;
    }
    .bmi-number {
      font-size: 4rem;
      font-weight: 300;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 8px;
    }
    .bmi-label {
      font-size: 1.1rem;
      font-weight: 600;
      padding: 4px 16px;
      border-radius: 20px;
      display: inline-block;
    }
    /* BMI gauge bar */
    .bmi-gauge {
      margin: 20px 0 4px;
      position: relative;
    }
    .gauge-bar {
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(to right, #0ea5e9 0%, #22c55e 30%, #f59e0b 55%, #ef4444 75%, #7c3aed 100%);
      position: relative;
    }
    .gauge-needle {
      position: absolute;
      top: -5px;
      width: 18px;
      height: 18px;
      background: #fff;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
      transform: translateX(-50%);
      transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .gauge-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--muted);
    }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-box {
      background: var(--surface2);
      border-radius: 10px;
      padding: 16px;
    }
    .stat-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .stat-val { font-size: 1.5rem; font-weight: 700; }
    .stat-unit { font-size: 0.8rem; color: var(--muted); margin-left: 2px; }

    /* TDEE table */
    .tdee-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .tdee-table th { text-align: left; color: var(--muted); font-weight: 500; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    .tdee-table td { padding: 10px 12px; border-bottom: 1px solid #1e2235; }
    .tdee-table tr:last-child td { border-bottom: none; }
    .tdee-table td:last-child { text-align: right; font-weight: 600; color: var(--accent); }
  </style>
</head>
<body>
<div class="page">
  <h1><span>⚖️</span> BMI・代謝チェッカー</h1>

  <div class="card">
    <h2>あなたの情報を入力</h2>
    <div class="fields">
      <div class="field">
        <label>身長 (cm)</label>
        <input type="number" id="height" placeholder="170" min="100" max="250">
      </div>
      <div class="field">
        <label>体重 (kg)</label>
        <input type="number" id="weight" placeholder="65" min="20" max="300">
      </div>
      <div class="field">
        <label>年齢</label>
        <input type="number" id="age" placeholder="25" min="10" max="120">
      </div>
      <div class="field">
        <label>性別</label>
        <div class="gender-row">
          <button class="gender-btn active" data-g="male">♂ 男性</button>
          <button class="gender-btn" data-g="female">♀ 女性</button>
        </div>
      </div>
    </div>
    <button class="calc-btn" id="calc-btn">計算する</button>
  </div>

  <div id="results">
    <div class="card bmi-hero">
      <div class="bmi-number" id="bmi-num">—</div>
      <div class="bmi-label" id="bmi-cat">—</div>
      <div class="bmi-gauge">
        <div class="gauge-bar">
          <div class="gauge-needle" id="needle" style="left:0%"></div>
        </div>
        <div class="gauge-labels">
          <span>低体重<br>〜18.5</span>
          <span>標準<br>25</span>
          <span>過体重<br>30</span>
          <span>肥満<br>35〜</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>基礎代謝・カロリー</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">基礎代謝量 (BMR)</div>
          <div class="stat-val"><span id="bmr">—</span><span class="stat-unit">kcal/日</span></div>
        </div>
        <div class="stat-box">
          <div class="stat-label">標準体重</div>
          <div class="stat-val"><span id="ideal">—</span><span class="stat-unit">kg</span></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>活動量別 消費カロリー目安 (TDEE)</h2>
      <table class="tdee-table">
        <thead><tr><th>活動レベル</th><th>kcal/日</th></tr></thead>
        <tbody id="tdee-body"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
  let gender = 'male';

  document.querySelectorAll('.gender-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.gender-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      gender = b.dataset.g;
    });
  });

  document.getElementById('calc-btn').addEventListener('click', () => {
    const h = parseFloat(document.getElementById('height').value);
    const w = parseFloat(document.getElementById('weight').value);
    const a = parseFloat(document.getElementById('age').value);
    if (!h || !w || !a || h < 100 || w < 20 || a < 10) {
      alert('正しい値を入力してください');
      return;
    }

    const bmi = w / ((h / 100) ** 2);
    const bmr = gender === 'male'
      ? 10 * w + 6.25 * h - 5 * a + 5
      : 10 * w + 6.25 * h - 5 * a - 161;
    const ideal = 22 * ((h / 100) ** 2);

    const cats = [
      { max: 18.5, label: '低体重', bg: 'rgba(14,165,233,0.2)', color: '#38bdf8' },
      { max: 25,   label: '標準',   bg: 'rgba(34,197,94,0.2)',  color: '#4ade80' },
      { max: 30,   label: '過体重', bg: 'rgba(245,158,11,0.2)', color: '#fbbf24' },
      { max: 35,   label: '肥満①', bg: 'rgba(239,68,68,0.2)',  color: '#f87171' },
      { max: Infinity, label: '肥満②', bg: 'rgba(124,58,237,0.2)', color: '#a78bfa' },
    ];
    const cat = cats.find(c => bmi < c.max);

    document.getElementById('bmi-num').textContent = bmi.toFixed(1);
    const catEl = document.getElementById('bmi-cat');
    catEl.textContent = cat.label;
    catEl.style.background = cat.bg;
    catEl.style.color = cat.color;
    document.getElementById('bmi-num').style.color = cat.color;

    // needle position (mapped: 10→0%, 40→100%)
    const pct = Math.min(100, Math.max(0, (bmi - 10) / 30 * 100));
    document.getElementById('needle').style.left = pct + '%';

    document.getElementById('bmr').textContent = Math.round(bmr);
    document.getElementById('ideal').textContent = ideal.toFixed(1);

    const levels = [
      ['ほぼ座りっぱなし', 1.2],
      ['軽い運動（週1〜3）', 1.375],
      ['適度な運動（週3〜5）', 1.55],
      ['激しい運動（週6〜7）', 1.725],
      ['非常に激しい運動', 1.9],
    ];
    document.getElementById('tdee-body').innerHTML = levels
      .map(([label, factor]) => `<tr><td>${label}</td><td>${Math.round(bmr * factor)}</td></tr>`)
      .join('');

    const res = document.getElementById('results');
    res.classList.add('show');
    res.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
</script>
</body>
</html>
